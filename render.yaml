services:
  - type: web
    name: naco
    runtime: php
    rootDir: backend
    buildCommand: composer install --no-dev --optimize-autoloader && chmod +x scripts/prepare-sqlite.sh && ./scripts/prepare-sqlite.sh
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    disk:
      name: naco-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: DB_FOREIGN_KEYS
        value: "true"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
