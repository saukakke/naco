name: Backend Validation

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: naco_test
          POSTGRES_USER: naco
          POSTGRES_PASSWORD: naco
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U naco -d naco_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find app bootstrap config database public resources routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prepare PostgreSQL application
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: naco_test
          DB_USERNAME: naco
          DB_PASSWORD: naco
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate migrations against PostgreSQL
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: naco_test
          DB_USERNAME: naco
          DB_PASSWORD: naco
        run: php artisan migrate:fresh --force

      - name: Run backend tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: naco_test
          DB_USERNAME: naco
          DB_PASSWORD: naco
        run: php artisan test --without-tty

      - name: Validate application boot and routes
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: naco_test
          DB_USERNAME: naco
          DB_PASSWORD: naco
        run: php artisan about && php artisan route:list --except-vendor
